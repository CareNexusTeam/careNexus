# Database Connection URL with automatic database creation enabled
server.port=7171
spring.datasource.url=jdbc:mysql://localhost:3306/carenexus?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Modern Hibernate 6/7 Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Schema DDL configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true