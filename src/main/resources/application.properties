# ===================================================================
# GLOBAL CARENEXUS BASELINE CONFIGURATIONS (Shared Team Settings)
# ===================================================================
server.port=8082
server.servlet.context-path=/

# Shared Database Properties
spring.datasource.url=jdbc:mysql://localhost:3306/carenexus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Engines
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================================
# MODULE 7: ANALYTICS & REPORTING CONFIGURATIONS (Racheet's Workspace Only)
# ===================================================================
# Strict logging isolation for your updated package name structure
logging.level.com.cts.careNexus.modules.analytics=DEBUG

# Custom isolated properties for your upcoming API development phase
carenexus.analytics.default-scope=GENERAL_COMPLIANCE
carenexus.analytics.simulation-enabled=true